# Every tunable parameter of ilcd, grouped by module. Units are in the key name or the comment.
# A region overrides values under `params:` with the same nesting (config/regions/*.yaml); unknown keys are errors.
# PROVISIONAL marks values not yet tested on data.
# "old:" names the exploratory script (archive indiana-lidar_2026-11-05) a value was carried over from.

data_src:
  region_buffer_m: 1000.0         # work area = region footprint buffered by this
  only_deliveries: []             # non-empty: the region uses only files of these deliveries (acceptance runs
                                  # that must match a single-delivery exploration result); empty = all
  legacy_bucket: https://opentopography.s3.sdsc.edu/pc-bulk/IN_2011_2013
  ept_boundaries: https://raw.githubusercontent.com/hobu/usgs-lidar/master/boundaries/resources.geojson
  counties: https://www2.census.gov/geo/tiger/GENZ2023/shp/cb_2023_us_county_500k.zip
  state_fips: "18"                # Indiana
  max_parallel_downloads: 8       # OT and EPT; rockyweb is never used (it blocks Big Red, HTTP 429)
  datum:
    n_samples: 3                  # sample cells per delivery
    min_margin_m: 0.40            # in a sample, one reading wins when its residual shift is this much smaller
    min_informative: 2            # informative samples needed for a decision; all must have the same winner
    max_residual_m: 0.30          # diagnostic only: residual of the winner above this flags a line-level shift
    coarse_step_m: 0.5            # two-stage grid search of the residual shift; old: pair_diagnostics.main
    coarse_span_m: 4.0
    fine_step_m: 0.1
    fine_span_m: 0.6
    max_points: 250000            # 2011 ground points sampled per cell
    probe_m: 1.0                  # a sample counts when, under both hypotheses, moving this far from the best shift
    min_sharpness: 0.02           # in x or y raises NMAD by at least this share. PROVISIONAL (flat cells fail)
    itrf_epoch: 2011.5            # old: pair_diagnostics.transform_2011
  geoid:
    legacy_grid: us_noaa_geoid09_conus.tif   # 2011-13 heights are NAVD88/GEOID09 in US survey feet
    project_grid: us_noaa_g2012bu0.tif       # converted to GEOID12B (0.7 cm at Monroe)
  osm:
    url: https://download.geofabrik.de/north-america/us/indiana-latest.osm.pbf
  points:
    noise_classes: [7, 18]
    z_below_ground_m: 3.0         # keep z within [ground p0.1 - this, ground p99.9 + z_above]; old: pair_diagnostics.load
    z_above_ground_m: 60.0
    read_pad_m: 20.0              # margin around a cell when reading points
  ept:
    base_url: https://s3-us-west-2.amazonaws.com/usgs-lidar-public
    pad_m: 20.0
    # The reference: the 2016-20 Indiana statewide 3DEP program (IN_Indiana_Statewide_LiDAR_2017_B17), 13 batches.
    # The public EPT bucket also holds the 2011-13 legacy data itself, 2010-13 county projects and neighbouring
    # states; none of them may serve as reference (checked 2026-11-05: 144 resources intersect Indiana).
    reference_batches: "^IN_Statewide_(B[12]|Opt1_B[1-5]|Opt2_B[1-6])_2017$"

flightlines:
  gap_s: 5.0                      # GPS-time gap that starts a new pass; old: swath_analysis.GAP
  min_pass_points: 0              # passes with fewer points are not linked (0: all, as the verified exploration rule)
  link:
    max_turn_deg: 20.0            # old: link_lines.MAX_TURN
    max_span_s: 900.0             # old: link_lines.MAX_SPAN
    pos_tol_m: 300.0              # |along-track distance - speed x time|; old: link_lines.POS_TOL
    cross_tol_m: 1500.0           # loose on purpose: nadir test 2026-11-04 (Carroll 31/31 lines, purity 1.00)
  nadir:
    max_scan_deg: 2.0             # diagnostic ground track from near-nadir returns
    min_points: 200
    min_span_share: 0.5
  block:
    max_gap_s: 2592000.0          # 30 days: a block is one flying season (Carroll 2011: five sorties over 18 days,
                                  # one scan-angle curve verified). PROVISIONAL statewide (see design.md section 12)
  class12_ground_tol_m: 0.3       # class-12 overlap points this close to the ground surface count as ground; old: swath_analysis.GROUND_TOL

refs:
  grid_res_m: 1.0                 # analysis grid of patch extraction
  ground:                         # hard ground; old: patches_v2 G_*
    min_points: 12
    max_rms_m: 0.03
    max_object_share: 0.15
    min_single_share: 0.85
    max_slope_deg: 15.0
    min_area_m2: 20.0
    ndvi_year: 2018               # NAIP year for the vegetation test
    ndvi_cut: -0.10               # hard ground needs mean NDVI below this; old runs 2026-10-22/23 ("naip2018, cut
                                  # -0.10, no OSM"; matches 88% of the GIO 2016 hard ground on tile 31101425)
    ndvi_quantile: 0.90           # not used yet: with OSM, calibrate the cut as this quantile of ground on motor roads
    object_hag_m: 0.3             # a point this far above the 3DEP DTM counts as an object
    narrow_half_width_m: 8.0      # old patch_class.HALF_W
    narrow_wide_share: 0.2        # narrow = fewer than this share of cells deeper than the half width; old WIDE_SHARE
    road_dist_m: 8.0              # a cell is on a road within this distance of an OSM vehicle-road centreline
    road_share: 0.5               # a patch is a road when at least this share of its cells is; old patch_class
    not_road: [footway, path, cycleway, steps, pedestrian, bridleway, corridor, proposed, construction]
  roof:                           # old: patches_v2 R_*, measure_patches
    min_hag_m: 2.5
    min_points: 10
    max_rms_m: 0.05
    max_slope_deg: 60.0
    max_normal_angle_deg: 5.0
    max_step_m: 0.10
    min_area_m2: 20.0
    measure_min_area_m2: 100.0    # roofs used for measuring; small roofs mix ridge sides
    edge_erosion_m: 2.0
    ndvi_margin: 0.10
  natural:                        # flat natural ground (also under canopy). PROVISIONAL: new in ilcd, tune on the Monroe forest cells
    max_slope_deg: 5.0
    max_rough_m: 0.05
    min_area_m2: 100.0
  slope:                          # sloped natural ground for the horizontal-shift term; old: hshift_fit
    min_slope_deg: 10.0           # old MIN_SLOPE
    max_slope_deg: 40.0           # PROVISIONAL: steeper cells are rarely planar at 3 m
    max_rms_m: 0.15               # PROVISIONAL: window-plane rms; old used every steep ground point
    min_points: 12
    min_area_m2: 20.0
    max_dz_m: 3.0                 # gross-error limit of a residual; old MAX_DZ
  screen:                         # per scope, across cells; old: measure_patches.flag_change, fit_field.load
    near_m: 200.0                 # neighbours of a patch for the change test
    min_neighbours: 5
    min_points: 20                # patches with fewer pooled 2011 points are neither tested nor used as neighbours
    flag_k: 3.0                   # flag |offset - neighbour median| > max(flag_min_m, flag_k sqrt(se^2 + scatter^2))
    flag_min_m: 0.05
    sys_sd_m: 0.015               # floor of the patch-to-patch scatter, and weight floor
    cell_gross_m: 0.30            # cell median this far from the scope median = real change; old: fit_field.GROSS_TILE
    water_buffer_m: 100.0         # patches closer to OSM water are screened out: banks move; old: fit_field.WATER_BUF
    water_search_m: 500.0         # distance to water is recorded up to this far
    use_cdl: true                 # exclude cropland patches (not implemented in the old code; not applied yet)
  obs:                            # old: patch_scan.py, measure_patches.py
    classes: [2, 12]              # 2011 classes measured on hard ground (class-12 overlap points included)
    outlier_m: 0.30               # drop points farther than this from the cell median residual
    min_points: 10                # per (patch, pass); old PASS_MIN

align:
  stage1:
    sys_sd_m: 0.015               # observation weight = 1 / (sigma^2 + sys_sd^2); old: fit_roll.SYS
    scan_knots: 8                 # cubic B-spline knots in scan angle, per block; old: fit_scan S_8
    scan_range_pct: [0.5, 99.5]   # knots span these percentiles of the block's scan angles
    ridge: 0.001                  # on the spline, removes the constant it shares with the line offsets
    fit_kinds: [road, hard_other, roof_flat, natural_flat]  # vertical terms; sloped ground joins when the
                                  # horizontal shift is fitted (line_hshift); [all] = every kind
    modern_reference_batch: auto  # 3DEP batch fixed at offset 0 (auto = the one with most observations)
    trend: block                  # one along-track trend per block (per-line trends overfit)
    hshift_min_obs: 30            # PROVISIONAL: fewer sloped-ground observations -> the line uses its block's shift
                                  # (the exploration's v3d pooled lines with < 1000 steep points)
  stage2:
    spacing_m: 1000.0             # B-spline knot spacing of the per-line field; old: final_fit h_km=1
    lam: 1000.0                   # smoothness weight; old: final_fit default
    ridge: 0.001
    fit_kinds: [road]             # stage 2 is fitted on road patches only

eval:
  cv:
    folds: 5                      # old: fit_field.FOLDS
    repeats: 10
    fold_unit: cell               # cell | patch | file | patch_file. file folds leak: a patch crossing a file boundary
                                  # is seen by passes of both files; the others keep each patch on one side
    segment_unit: cell            # same choices; patch_file = the exploration's tile x pass segments
  injection:                      # old: fit_field.injection / fit_tradeoff.inject
    radii_m: [50.0, 100.0, 200.0, 500.0, 1000.0]   # old: fit_field.INJECT_R
    amount_m: 0.10                # alternately + and - at the centres
    n_centres: 30
    seed: 1
    target_kinds: [all]           # observations that receive the fake change
  status:
    corrected_max_nmad_m: 0.05    # PROVISIONAL
    min_holdout: 10

change:
  dod:
    res_m: 2.0
    lod_z: 1.96
    min_points: 3
  m3c2:                           # old: m3c2_sites
    core_res_m: 1.0
    cylinder_radius_m: 1.5
    normal_radii_m: [1.0, 2.0, 4.0]
    max_distance_m: 10.0
    registration_error_m: 0.05
  objects:                        # old: m3c2_objects
    min_magnitude_m: 0.30
    dbscan_eps_m: 2.5
    dbscan_min_samples: 10
    min_area_m2: 25.0
  structures:
    min_height_m: 2.5             # old: big_change
    min_area_m2: 50.0

viz_label:
  scene_points: 45000             # old: m3c2_view_data N_PTS
  imagery:
    legacy_year: 2011             # IndianaMap leaf-off orthophotos
    modern_source: naip
